<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Gallery | Dr. Handyman Service LLC</title>
<style>*{box-sizing:border-box}body{margin:0;background:#080a09;color:#fff;font-family:Arial,Helvetica,sans-serif}.wrap{width:min(1180px,92%);margin:auto}nav{position:sticky;top:0;z-index:50;background:rgba(8,10,9,.95);border-bottom:1px solid #252b26}.navin{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand img{width:112px;display:block}.links{display:flex;gap:22px;align-items:center}.links a{color:#fff;text-decoration:none;font-weight:700}.btn{background:#79d618!important;color:#071006!important;padding:13px 20px;border-radius:10px}header{text-align:center;padding:70px 0 36px}.eyebrow{color:#79d618;font-weight:800;letter-spacing:2px;text-transform:uppercase;font-size:12px}h1{font-size:clamp(40px,6vw,70px);margin:12px 0}p{color:#a9afa9}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-bottom:80px}.gcard{padding:0;border:1px solid #282e29;border-radius:18px;overflow:hidden;background:#111;cursor:pointer;aspect-ratio:1/1}.gcard img{width:100%;height:100%;object-fit:cover;display:block;transition:.3s}.gcard:hover img{transform:scale(1.02)}.lb{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.96);z-index:100;padding:20px}.lb.open{display:flex}.lb img{max-width:96vw;max-height:92vh;width:auto;height:auto;object-fit:contain}.lb button{position:absolute;border:0;background:rgba(255,255,255,.14);color:#fff;width:48px;height:48px;border-radius:50%;font-size:25px;cursor:pointer}.close{right:18px;top:18px}.prev{left:18px;top:50%}.next{right:18px;top:50%}footer{padding:35px 0;border-top:1px solid #252a25;color:#909690}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.links a:not(.btn){display:none}}</style></head><body>
<nav><div class="wrap navin"><a class="brand" href="index.html"><img src="https://i.postimg.cc/N0x4DqPg/logo-Green-Photoroom.png" alt="Dr. Handyman"></a><div class="links"><a href="index.html">Home</a><a href="gallery.html">Gallery</a><a class="btn" href="https://docs.google.com/forms/d/e/1FAIpQLSd27i79l5nTVIS-A1Z87skUWGp-7frb4_65ueZDM3YYvd5-7w/viewform?usp=dialog" target="_blank">Get a Quote</a></div></div></nav>
<header class="wrap"><div class="eyebrow">Recent Work</div><h1>Project Gallery</h1><p>Completed projects by Dr. Handyman Service LLC.</p></header><main class="wrap grid" id="grid"></main>
<div class="lb" id="lb" onclick="if(event.target===this)closeLb()"><button class="close" onclick="closeLb()">×</button><button class="prev" onclick="step(-1)">‹</button><img id="lbimg" alt="Project photo"><button class="next" onclick="step(1)">›</button></div>
<footer><div class="wrap">© 2026 Dr. Handyman Service LLC • Katy & Greater Houston</div></footer><script src="gallery-data.js"></script><script>
const pics=window.GALLERY_IMAGES||[], grid=document.getElementById('grid');let pos=0;pics.forEach((src,i)=>{const b=document.createElement('button');b.className='gcard';b.innerHTML=`<img src="${src}" alt="Dr. Handyman completed project ${i+1}" loading="lazy">`;b.onclick=()=>openLb(i);grid.appendChild(b)});function openLb(i){pos=i;document.getElementById('lbimg').src=pics[pos];document.getElementById('lb').classList.add('open')}function closeLb(){document.getElementById('lb').classList.remove('open')}function step(n){if(!pics.length)return;pos=(pos+n+pics.length)%pics.length;document.getElementById('lbimg').src=pics[pos]}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLb();if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});</script></body></html>

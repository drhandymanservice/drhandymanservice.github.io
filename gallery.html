t"></i></button></div><script>const images=['https://i.postimg.cc/K3nsqjpJ/Chat-GPT-Image-11-sent-2026-g-22-08-22.png','https://i.postimg.cc/9Rwk9JGw/Chat-GPT-Image-12-sent-2026-g-00-02-55.png','https://i.postimg.cc/zHmcFK7X/Chat-GPT-Image-12-sent-2026-g-00-06-18.png','https://i.postimg.cc/FkjnWzC9/Chat-GPT-Image-12-sent-2026-g-00-09-10.png','https://i.postimg.cc/WqMfWzYN/Chat-GPT-Image-12-sent-2026-g-00-24-24.png','https://i.postimg.cc/0KpHWjXY/Chat-GPT-Image-18-sent-2026-g-20-28-02.png','https://i.postimg.cc/Cnj6P5rC/Chat-GPT-Image-18-sent-2026-g-20-34-42.png','https://i.postimg.cc/WqMfWzY8/Chat-GPT-Image-18-sent-2026-g-20-42-25.png','https://i.postimg.cc/q68ZbqDR/Izobrazenie-Chat-GPT-25-sent-2026-g-21-35-20.png','https://i.postimg.cc/RJcbshpc/Izobrazenie-Chat-GPT-25-sent-2026-g-21-39-25.png','https://i.postimg.cc/XBwDHq15/Izobrazenie-Chat-GPT-25-sent-2026-g-21-48-57.png'];const lb=document.getElementById('lb'),im=document.getElementById('lbimg');let n=0;function openImg(i){n=(i+images.length)%images.length;im.src=images[n];lb.classList.add('open');document.body.style.overflow='hidden'}function closeImg(){lb.classList.remove('open');document.body.style.overflow=''}document.querySelectorAll('.item').forEach(x=>x.onclick=()=>openImg(+x.dataset.index));document.querySelector('.close').onclick=closeImg;document.querySelector('.next').onclick=()=>openImg(n+1);document.querySelector('.prev').onclick=()=>openImg(n-1);lb.onclick=e=>{if(e.target===lb)closeImg()};document.onkeydown=e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')closeImg();if(e.key==='ArrowRight')openImg(n+1);if(e.key==='ArrowLeft')openImg(n-1)};</script></body></html>
